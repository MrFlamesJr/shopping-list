<div class="shopping-list-container">
    <div class="top">
        <h2>Shopping List</h2>
        <div class="add-item">
            <input type="text" placeholder="Enter new item name..." [(ngModel)]="newItemName" (keydown.enter)="addItem()" />
            <button (click)="addItem()" title="Add item"><span class="icon"></span></button>
        </div>
    </div>

    <div class="shopping-list">
        @if (shoppingList.length === 0) {
            <p>No items in the shopping list.</p>
        } @else {
            @for (item of shoppingList; track item.id) {
                <app-list-item [item]="item" (remove)="removeItem($event)"/>
                
            }
        }
    </div>
</div>
